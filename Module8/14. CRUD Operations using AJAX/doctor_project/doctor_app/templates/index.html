<!DOCTYPE html>
<html>
<head>
    <title>Doctor AJAX CRUD</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body class="container mt-5">

<h2 class="text-center mb-4">Doctor Manager (AJAX CRUD)</h2>

<!-- CSRF TOKEN HIDDEN -->
<input type="hidden" id="csrf_token" value="{{ csrf_token }}">

<input type="hidden" id="doc_id">

<div class="card p-3 shadow mb-4">
    <input type="text" id="name" placeholder="Doctor Name" class="form-control mb-2">
    <input type="text" id="specialization" placeholder="Specialization" class="form-control mb-2">
    <input type="number" id="experience" placeholder="Experience (years)" class="form-control mb-2">

    <button class="btn btn-success" onclick="saveDoctor()">Save</button>
</div>

<table class="table table-bordered table-striped">
    <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Specialization</th>
            <th>Experience</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="doctorTable">
        {% for d in doctors %}
        <tr id="row{{d.id}}">
            <td>{{d.name}}</td>
            <td>{{d.specialization}}</td>
            <td>{{d.experience}}</td>
            <td>
                <button class="btn btn-warning btn-sm"
                onclick="editDoctor({{d.id}}, '{{d.name}}', '{{d.specialization}}', '{{d.experience}}')">
                Edit</button>

                <button class="btn btn-danger btn-sm"
                onclick="deleteDoctor({{d.id}})">
                Delete</button>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>

function getCSRF() {
    return document.getElementById("csrf_token").value;
}

function saveDoctor() {
    let id = $("#doc_id").val();
    let url = id ? `/edit/${id}/` : `/add/`;

    $.ajax({
        url: url,
        type: "POST",
        data: {
            name: $("#name").val(),
            specialization: $("#specialization").val(),
            experience: $("#experience").val(),
            csrfmiddlewaretoken: getCSRF()
        },
        success: function () {
            location.reload(); // safe reload
        }
    });
}

function editDoctor(id, name, specialization, experience) {
    $("#doc_id").val(id);
    $("#name").val(name);
    $("#specialization").val(specialization);
    $("#experience").val(experience);
}

function deleteDoctor(id) {
    $.ajax({
        url: `/delete/${id}/`,
        type: "POST",
        data: {
            csrfmiddlewaretoken: getCSRF()
        },
        success: function () {
            $("#row" + id).remove();
        }
    });
}

</script>

</body>
</html>
